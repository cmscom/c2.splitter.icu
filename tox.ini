[tox]
# dependency_groups (the mypy environment) needs tox 4.22
min_version = 4.22
envlist =
    ruff-check,
    mypy,
    py{310,311,312,313}-Plone60,
    py{310,311,312,313}-Plone61,
    py{310,311,312,313,314}-Plone62,

skip_missing_interpreters = True


[testenv]
skip_install = true

commands_pre =
    {envpython} -m pip install -c {toxinidir}/{env:constraints_file} -e "{toxinidir}[test]"

commands =
    coverage run {envbindir}/pytest -v -rs {posargs:{toxinidir}/tests}

setenv =
    COVERAGE_FILE=.coverage.{envname}
    Plone60: constraints_file=constraints_plone60.txt
    Plone61: constraints_file=constraints_plone61.txt
    Plone62: constraints_file=constraints_plone62.txt

deps =
    Plone60: -rrequirements_plone60.txt
    Plone61: -rrequirements_plone61.txt
    Plone62: -rrequirements_plone62.txt
    coverage[toml]


[testenv:ruff-check]
basepython = python3.12
skip_install = True
commands_pre =
deps =
    -cconstraints_plone62.txt
    ruff

commands =
    ruff check --no-fix src tests
    ruff format --check --diff src tests


[testenv:mypy]
basepython = python3.14
dependency_groups = dev
setenv =
    constraints_file=constraints_plone62.txt
deps =
    -rrequirements_plone62.txt
commands =
    mypy src tests


[testenv:ruff-fix]
basepython = python3.12
skip_install = True
commands_pre =
deps =
    -cconstraints_plone62.txt
    ruff

commands =
    ruff check --fix src tests
    ruff format src tests


[testenv:coverage-report]
skip_install = true
basepython = python3.12
commands_pre =

deps =
    coverage[toml]
    -cconstraints_plone62.txt

setenv =
    COVERAGE_FILE=.coverage

commands =
    coverage erase
    coverage combine
    coverage html
    coverage xml
    coverage report
